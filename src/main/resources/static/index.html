<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="page-shell">
    <section class="shortener-panel" aria-labelledby="page-title">
        <div class="panel-header">
            <p class="eyebrow">URL Shortener</p>
            <h1 id="page-title">Create a short link</h1>
        </div>

        <form id="shorten-form" class="shorten-form">
            <label for="long-url">Long URL</label>
            <div class="input-row">
                <input
                        id="long-url"
                        name="longUrl"
                        type="url"
                        placeholder="https://example.com/very/long/url"
                        autocomplete="url"
                        required>
                <button id="submit-button" type="submit">Shorten</button>
            </div>
        </form>

        <div id="status" class="status" role="status" aria-live="polite"></div>

        <section id="result" class="result" hidden>
            <label for="short-url">Short URL</label>
            <div class="input-row">
                <input id="short-url" type="text" readonly>
                <button id="copy-button" type="button">Copy</button>
            </div>
        </section>
    </section>
</main>

<script src="/app.js"></script>
</body>
</html>
