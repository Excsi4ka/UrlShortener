spring.application.name=urlshortener
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/urlshortener}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:12345}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

resilience4j.ratelimiter.instances.paymentService.limitForPeriod=${RATE_LIMIT:5}
resilience4j.ratelimiter.instances.paymentService.limitRefreshPeriod=${REFRESH_PERIOD:1s}
resilience4j.ratelimiter.instances.paymentService.timeoutDuration=0ms