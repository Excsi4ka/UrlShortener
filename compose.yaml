services:
  app:
    build:
      context: .
    image: urlshortener-app:latest
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/urlshortener
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
      JPA_DDL_AUTO: update
      REDIS_URL: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
    volumes:
      - postgres18-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine

volumes:
  postgres18-data:
