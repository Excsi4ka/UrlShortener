services:
  app:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/urlshortener
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
      JPA_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener -d urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
